<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Immer hell, auch im System-Dunkelmodus (F-06) -->
    <meta name="color-scheme" content="light only">
    <title>Nico Fuchs | 3D Portfolio</title>
    <style>
        :root { color-scheme: light only; }

        body {
            margin: 0;
            overflow: hidden; /* Verhindert Scrollbalken */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f8f8fa;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }

        /* Das UI Overlay (Fadenkreuz / Info) */
        #ui-layer {
            position: absolute;
            top: 20px;
            left: 20px;
            pointer-events: none; /* Klicks gehen durch diesen Text durch ins 3D */
            color: #333;
        }

        h1 {
            margin: 0;
            font-size: 1.5rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        p {
            margin: 5px 0 0 0;
            font-family: monospace;
            color: #666;
        }

        /* Das versteckte Modal (Fenster), das beim Klick aufgeht */
        #project-modal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            width: 80%;
            max-width: 600px;
            display: none; /* Standardmäßig versteckt */
            z-index: 10;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0,0,0,0.05);
        }

        #project-content p {
            color: #333;
            line-height: 1.6;
            font-family: inherit;
            margin-top: 10px;
        }

        #project-modal.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translate(-50%, -45%); }
            to { opacity: 1; transform: translate(-50%, -50%); }
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 1.5rem;
            cursor: pointer;
            color: #999;
            transition: color 0.2s;
        }

        .close-btn:hover {
            color: #000;
        }

        .tag {
            background: #000;
            color: #fff;
            padding: 4px 8px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 0.8rem;
            display: inline-block;
            margin-right: 5px;
            margin-bottom: 15px;
        }
    </style>

    <!-- Import Maps für modernes JavaScript (erlaubt das Laden von Three.js ohne Server/Bundler) -->
    <script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>
</head>
<body>

    <!-- Hier lebt die 3D Szene -->
    <div id="canvas-container"></div>

    <!-- UI Overlay (Immer sichtbar) -->
    <div id="ui-layer">
        <h1>Nico Fuchs</h1>
        <p>R&D Engineer // Interactive Portfolio</p>
        <p style="margin-top: 15px; color: #ff3366; font-weight: bold;">(Klicke auf ein Objekt!)</p>
    </div>

    <!-- Das Fenster, das sich nach dem Klick öffnet -->
    <div id="project-modal">
        <span class="close-btn" id="close-modal">×</span>
        <div id="project-content"></div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
        import { createStudio } from './js/studio.js';
        import { MenuCamera } from './js/menu-camera.js';
        import { loadContent, createObjects } from './js/objects.js';

        // Desktop = Maus mit Hover; alles andere bekommt die Handy-Variante (kein Mitschwenken, günstigere Spiegelung)
        const desktop = window.matchMedia('(hover: hover) and (pointer: fine)').matches;
        const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        // 1. RENDERER, SZENE, KAMERA
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // N-02
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 100);

        // 2. STUDIO: Hohlkehle, Spiegelboden, Lichtband, Softboxen, Environment-Map (js/studio.js)
        const studio = createStudio(renderer, scene, { mobile: !desktop });

        // Menü-Kamera: fest, minimal mitschwenkend, Einstiegsfahrt mit Licht-an (js/menu-camera.js)
        const menuCam = new MenuCamera(camera, { sway: desktop && !reducedMotion, intro: !reducedMotion });

        // Alle Modelle sind Draco-komprimierte GLBs aus Blender
        const dracoLoader = new DRACOLoader();
        dracoLoader.setDecoderPath('https://unpkg.com/three@0.160.0/examples/jsm/libs/draco/gltf/');
        const gltfLoader = new GLTFLoader();
        gltfLoader.setDRACOLoader(dracoLoader);

        // 3. OBJEKTE: alles aus content/objects.json (js/objects.js)
        const content = await loadContent('./content/objects.json');
        const lang = document.documentElement.lang === 'de' ? 'de' : 'en'; // Umschalter kommt mit F-60
        let objectGroups = []; // vor createObjects, weil das schon beim Bauen updateFrame aufruft
        const objects = createObjects(scene, renderer, content.objects, gltfLoader, updateFrame);
        objectGroups = objects.groups;
        const hitTargets = objects.hitTargets;

        // Rahmen = alle Objekte (im Querformat plus Softboxen)
        function updateFrame() {
            const frame = new THREE.Box3();
            const softboxes = camera.aspect >= 1 ? studio.frameObjects : [];
            for (const group of [...objectGroups, ...softboxes]) frame.union(new THREE.Box3().setFromObject(group));
            menuCam.frame(frame);
        }
        updateFrame();

        // 4. EINSTIEG: Antippen, Klicken oder eine Taste ueberspringt die Kamerafahrt (F-05)
        let suppressClick = false;
        const skipIntro = (event) => {
            // der Klick, der die Fahrt abbricht, oeffnet noch kein Fenster
            suppressClick = menuCam.inIntro && event.type === 'pointerdown';
            menuCam.skipIntro();
        };
        window.addEventListener('pointerdown', skipIntro);
        window.addEventListener('keydown', skipIntro);

        // 5. RAYCASTING (Klick-Erkennung)
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        window.addEventListener('click', (event) => {
            if (suppressClick) { suppressClick = false; return; }
            // Umrechnung der Mauskoordinaten für Three.js (-1 bis +1)
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            // Strahl von der Kamera durch die Mausposition schießen
            raycaster.setFromCamera(mouse, camera);

            // Prüfen, ob der Strahl unsere interaktiven Objekte trifft
            const intersects = raycaster.intersectObjects(hitTargets);

            if (intersects.length > 0) {
                // Treffer! Wir öffnen das HTML Modal
                openProject(intersects[0].object.userData.id);
            }
        });

        // 6. UI LOGIK (Fenster mit dem passenden Projekt öffnen / schließen)
        function openProject(id) {
            const def = content.objects.find((o) => o.id === id);
            const el = document.getElementById('project-content');
            el.replaceChildren();
            const add = (tag, text, parent = el) => {
                const node = document.createElement(tag);
                node.textContent = text;
                parent.appendChild(node);
                return node;
            };
            for (const tag of def.tags ?? []) add('div', tag).className = 'tag';
            add('h2', def.title[lang]);
            for (const text of def.text?.[lang] ?? []) add('p', text);
            for (const link of def.links ?? []) {
                const a = add('a', link.label[lang], add('p', ''));
                a.href = link.url;
                a.target = '_blank';
                a.rel = 'noopener';
            }
            document.getElementById('project-modal').classList.add('active');
        }

        document.getElementById('close-modal').addEventListener('click', () => {
            document.getElementById('project-modal').classList.remove('active');
        });

        // 7. ANIMATION LOOP (Sorgt dafür, dass das Bild gezeichnet wird)
        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const dt = Math.min(clock.getDelta(), 0.1);
            menuCam.update(dt);
            // Licht geht waehrend der Fahrt an, etwas verzoegert gegenueber der Bewegung
            studio.setLight(THREE.MathUtils.smoothstep(menuCam.introT, 0.05, 0.7));
            renderer.render(scene, camera);
        }

        // Auf Fenstergrößenänderung reagieren: neues Seitenverhältnis, neuer Abstand (F-04)
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            updateFrame();
        });

        animate();
    </script>
</body>
</html>
