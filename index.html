<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Immer hell, auch im System-Dunkelmodus (F-06) -->
    <meta name="color-scheme" content="light only">
    <title>Nico Fuchs | 3D Portfolio</title>
    <style>
        :root { color-scheme: light only; }

        body {
            margin: 0;
            overflow: hidden; /* Verhindert Scrollbalken */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f8f8fa;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }

        /* Das UI Overlay (Fadenkreuz / Info) */
        #ui-layer {
            position: absolute;
            top: 20px;
            left: 20px;
            pointer-events: none; /* Klicks gehen durch diesen Text durch ins 3D */
            color: #333;
        }

        h1 {
            margin: 0;
            font-size: 1.5rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        p {
            margin: 5px 0 0 0;
            font-family: monospace;
            color: #666;
        }

        /* Fenster (F-36): Desktop als Karte über dem Studio, Handy als Vollbild-Sheet von unten */
        #project-modal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: none; /* Standardmäßig versteckt */
            flex-direction: column;
            width: 80%;
            max-width: 640px;
            max-height: 86vh;
            background: rgba(255, 255, 255, 0.96);
            border-radius: 8px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            z-index: 10;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0,0,0,0.05);
        }
        #project-modal.wide { max-width: 920px; }

        #project-content {
            overflow-y: auto;
            overscroll-behavior: contain;
            padding: 40px;
        }
        #project-content h2 { margin: 0 0 4px; }
        #project-content h3 {
            margin: 24px 0 8px;
            font-size: 0.8rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #666;
        }
        #project-content p {
            color: #333;
            line-height: 1.6;
            font-family: inherit;
            margin-top: 10px;
        }

        #project-modal.active {
            display: flex;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translate(-50%, -45%); }
            to { opacity: 1; transform: translate(-50%, -50%); }
        }

        @media (hover: none), (pointer: coarse) {
            #project-modal, #project-modal.wide {
                position: fixed;
                top: 0;
                left: 0;
                transform: none;
                width: 100%;
                max-width: none;
                height: 100%;
                max-height: none;
                border-radius: 0;
                border: 0;
                background: #fff;
            }
            #project-modal.active { animation: sheetIn 0.3s ease; }
            #project-content { padding: 56px 20px calc(32px + env(safe-area-inset-bottom)); }
        }
        @keyframes sheetIn {
            from { transform: translateY(100%); }
            to { transform: none; }
        }
        @media (prefers-reduced-motion: reduce) {
            #project-modal.active { animation: none; }
        }

        /* Buttons, Skills, Ladeanzeige, Medien im Fenster */
        .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
        .btn {
            display: inline-flex;
            align-items: center;
            min-height: 44px;
            padding: 0 18px;
            border-radius: 22px;
            border: 1px solid #d6d6db;
            color: #111;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
        }
        .btn:hover { border-color: #111; }
        .btn.primary { background: #111; border-color: #111; color: #fff; }
        .btn.primary:hover { background: #333; }
        .btn:focus-visible { outline: 3px solid #f5c400; outline-offset: 2px; }
        .skills { display: flex; flex-wrap: wrap; gap: 8px; padding: 0; margin: 0; list-style: none; }
        .skills li { padding: 6px 12px; border-radius: 14px; background: #f0f0f2; font-size: 0.85rem; }

        .loading {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: #666;
            font-size: 0.9rem;
            background: #f4f4f6;
        }
        .loading.failed { color: #a33; }
        .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid #d6d6db;
            border-top-color: #f5c400;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .pdf { position: relative; margin-top: 20px; height: max(320px, calc(86vh - 300px)); border-radius: 6px; overflow: hidden; background: #f4f4f6; }
        .pdf iframe { width: 100%; height: 100%; border: 0; }
        .pdf.preview { height: auto; min-height: 200px; max-width: 360px; border: 1px solid #e4e4e8; }
        .pdf.preview img { display: block; width: 100%; height: auto; }

        .impact-demo { margin: 20px 0 0; }
        .impact-demo canvas { display: block; width: min(100%, 340px); aspect-ratio: 1; margin: 0 auto; }
        .impact-demo figcaption { margin-top: 8px; color: #666; font-size: 0.85rem; text-align: center; }

        .model-view { position: relative; margin-top: 20px; height: min(55vh, 460px); border-radius: 6px; overflow: hidden; background: #f4f4f6; touch-action: none; }
        .model-view canvas { display: block; width: 100%; height: 100%; cursor: grab; }
        .model-view .hint { position: absolute; left: 12px; bottom: 8px; margin: 0; font-size: 0.75rem; color: #888; pointer-events: none; }

        .close-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            z-index: 1;
            width: 44px;
            height: 44px;
            border: 0;
            background: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: #999;
            transition: color 0.2s;
        }

        /* Klick daneben schließt das Fenster (F-23) */
        #modal-backdrop {
            position: fixed;
            inset: 0;
            z-index: 9;
            display: none;
            background: rgba(20, 20, 24, 0.08);
        }
        #modal-backdrop.active { display: block; }

        /* Labels über den Objekten (F-20 bis F-22, F-25): Buttons, mindestens 44 × 44 px */
        #labels {
            position: absolute;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
        }
        .obj-label {
            position: absolute;
            left: 0;
            top: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 44px;
            min-height: 44px;
            padding: 0;
            border: 0;
            border-radius: 22px;
            background: none;
            cursor: pointer;
            pointer-events: auto;
            opacity: 0;
            transition: opacity 0.2s;
        }
        .obj-label span {
            padding: 8px 14px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.92);
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
            color: #111;
            font: 600 0.72rem/1 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            white-space: nowrap;
        }
        .obj-label span::before {
            content: "";
            display: inline-block;
            width: 7px;
            height: 7px;
            margin-right: 7px;
            border-radius: 50%;
            background: #c9c9ce;
            vertical-align: 1px;
            transition: background 0.2s;
        }
        .obj-label.active span::before { background: #f5c400; }
        .obj-label.shown { opacity: 1; }
        .obj-label:focus-visible { outline: none; }
        .obj-label:focus-visible span {
            outline: 3px solid #f5c400;
            outline-offset: 2px;
        }

        .close-btn:focus-visible {
            outline: 3px solid #f5c400;
            outline-offset: -4px;
            border-radius: 50%;
        }

        .close-btn:hover {
            color: #000;
        }

        .tag {
            background: #000;
            color: #fff;
            padding: 4px 8px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 0.8rem;
            display: inline-block;
            margin-right: 5px;
            margin-bottom: 15px;
        }
    </style>

    <!-- Import Maps für modernes JavaScript (erlaubt das Laden von Three.js ohne Server/Bundler) -->
    <script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>
</head>
<body>

    <!-- Hier lebt die 3D Szene -->
    <div id="canvas-container"></div>

    <!-- UI Overlay (Immer sichtbar) -->
    <div id="ui-layer">
        <h1>Nico Fuchs</h1>
        <p>R&D Engineer // Interactive Portfolio</p>
        <p style="margin-top: 15px; color: #ff3366; font-weight: bold;">(Klicke auf ein Objekt!)</p>
    </div>

    <!-- Labels über den Objekten, werden in js/labels.js erzeugt -->
    <div id="labels"></div>

    <!-- Das Fenster, das sich nach dem Klick öffnet -->
    <div id="modal-backdrop"></div>
    <div id="project-modal" role="dialog" aria-modal="true" aria-labelledby="project-title">
        <button type="button" class="close-btn" id="close-modal" aria-label="Schließen">×</button>
        <div id="project-content"></div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
        import { createStudio } from './js/studio.js';
        import { MenuCamera } from './js/menu-camera.js';
        import { loadContent, createObjects } from './js/objects.js';
        import { Labels } from './js/labels.js';
        import { renderWindow } from './js/windows.js';

        // Desktop = Maus mit Hover; alles andere bekommt die Handy-Variante (kein Mitschwenken, günstigere Spiegelung)
        const desktop = window.matchMedia('(hover: hover) and (pointer: fine)').matches;
        const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        // 1. RENDERER, SZENE, KAMERA
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // N-02
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 100);

        // 2. STUDIO: Hohlkehle, Spiegelboden, Lichtband, Softboxen, Environment-Map (js/studio.js)
        const studio = createStudio(renderer, scene, { mobile: !desktop });

        // Menü-Kamera: fest, minimal mitschwenkend, Einstiegsfahrt mit Licht-an (js/menu-camera.js)
        const menuCam = new MenuCamera(camera, { sway: desktop && !reducedMotion, intro: !reducedMotion });

        // Alle Modelle sind Draco-komprimierte GLBs aus Blender
        const dracoLoader = new DRACOLoader();
        dracoLoader.setDecoderPath('https://unpkg.com/three@0.160.0/examples/jsm/libs/draco/gltf/');
        const gltfLoader = new GLTFLoader();
        gltfLoader.setDRACOLoader(dracoLoader);

        // 3. OBJEKTE: alles aus content/objects.json (js/objects.js)
        const content = await loadContent('./content/objects.json');
        const lang = document.documentElement.lang === 'de' ? 'de' : 'en'; // Umschalter kommt mit F-60
        let objectGroups = []; // vor createObjects, weil das schon beim Bauen updateFrame aufruft
        const objects = createObjects(scene, renderer, content.objects, gltfLoader, updateFrame);
        objectGroups = objects.groups;
        const hitTargets = objects.hitTargets;
        const labels = new Labels(document.getElementById('labels'), objects.items, lang, {
            alwaysVisible: !desktop, // F-21
            onOpen: (id) => openProject(id),
        });

        // Rahmen = alle Objekte (im Querformat plus Softboxen)
        function updateFrame() {
            const frame = new THREE.Box3();
            const softboxes = camera.aspect >= 1 ? studio.frameObjects : [];
            for (const group of [...objectGroups, ...softboxes]) frame.union(new THREE.Box3().setFromObject(group));
            menuCam.frame(frame);
        }
        updateFrame();

        // 4. EINSTIEG: Antippen, Klicken oder eine Taste ueberspringt die Kamerafahrt (F-05)
        let suppressClick = false;
        const skipIntro = (event) => {
            // der Klick, der die Fahrt abbricht, oeffnet noch kein Fenster
            suppressClick = menuCam.inIntro && event.type === 'pointerdown' && event.target === renderer.domElement;
            menuCam.skipIntro();
        };
        window.addEventListener('pointerdown', skipIntro);
        window.addEventListener('keydown', skipIntro);

        // 5. RAYCASTING: Hover am Desktop (F-20), Klick bzw. Antippen öffnet direkt (F-21)
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        const modal = document.getElementById('project-modal');
        const backdrop = document.getElementById('modal-backdrop');

        function pick(event) {
            // Umrechnung der Mauskoordinaten für Three.js (-1 bis +1)
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            return raycaster.intersectObjects(hitTargets)[0]?.object.userData.id ?? null;
        }

        renderer.domElement.addEventListener('pointermove', (event) => {
            if (event.pointerType !== 'mouse') return;
            labels.sceneHover = pick(event);
            renderer.domElement.style.cursor = labels.sceneHover ? 'pointer' : '';
        });
        renderer.domElement.addEventListener('pointerleave', () => {
            labels.sceneHover = null;
            renderer.domElement.style.cursor = '';
        });
        renderer.domElement.addEventListener('click', (event) => {
            if (suppressClick) { suppressClick = false; return; }
            const id = pick(event);
            if (id) openProject(id);
        });

        // 6. FENSTER: öffnen, schließen, eigene URL pro Fenster (F-23, F-24)
        // Öffnen legt einen History-Eintrag `#id` an, damit Zurück (Geste oder Button) das Fenster schließt.
        const byId = (id) => content.objects.find((o) => o.id === id && o.visible !== false);
        let returnFocus = null;

        function openProject(id) {
            if (!byId(id)) return;
            if (location.hash !== '#' + id) history.pushState({ object: id }, '', '#' + id);
            showProject(id);
        }

        function closeProject() {
            if (!modal.classList.contains('active')) return;
            // selbst angelegter Eintrag: zurückgehen; Deep-Link von außen: nur den Hash entfernen
            if (history.state?.object) history.back();
            else {
                history.replaceState(null, '', location.pathname + location.search);
                hideProject();
            }
        }

        let cleanupWindow = null;
        let shownId = null;
        function showProject(id) {
            if (id === shownId) return; // hashchange und popstate kommen oft beide
            shownId = id;
            const def = byId(id);
            cleanupWindow?.();
            // Fensterinhalt je nach Typ (js/windows.js); Schweres lädt erst jetzt (F-35)
            cleanupWindow = renderWindow(def, document.getElementById('project-content'), { lang, mobile: !desktop, reducedMotion, gltfLoader });
            modal.classList.toggle('wide', def.window === 'pdf' || def.window === 'model+text');
            if (!modal.classList.contains('active')) returnFocus = document.activeElement;
            menuCam.skipIntro();
            modal.classList.add('active');
            backdrop.classList.add('active');
            labels.sceneHover = null;
            document.getElementById('close-modal').focus();
        }

        function hideProject() {
            cleanupWindow?.();
            cleanupWindow = null;
            shownId = null;
            document.getElementById('project-content').replaceChildren();
            modal.classList.remove('active');
            backdrop.classList.remove('active');
            if (returnFocus?.isConnected) returnFocus.focus();
            returnFocus = null;
        }

        // Hash bestimmt, welches Fenster offen ist: Zurück, Vor, Deep-Link, Hash von Hand geändert
        function syncFromHash() {
            let id = '';
            try { id = decodeURIComponent(location.hash.slice(1)); } catch { /* kaputter Hash: kein Fenster */ }
            if (byId(id)) showProject(id);
            else if (modal.classList.contains('active')) hideProject();
        }
        window.addEventListener('popstate', syncFromHash);
        window.addEventListener('hashchange', syncFromHash);
        syncFromHash();

        document.getElementById('close-modal').addEventListener('click', closeProject);
        backdrop.addEventListener('click', closeProject);
        window.addEventListener('keydown', (event) => {
            if (!modal.classList.contains('active')) return;
            if (event.key === 'Escape') closeProject();
            // Fokusfalle (N-07): Tab bleibt im Fenster
            if (event.key === 'Tab') {
                const focusable = [...modal.querySelectorAll('button, a[href]')];
                const first = focusable[0], last = focusable[focusable.length - 1];
                if (event.shiftKey && document.activeElement === first) { last.focus(); event.preventDefault(); }
                else if (!event.shiftKey && document.activeElement === last) { first.focus(); event.preventDefault(); }
            }
        });

        // 7. ANIMATION LOOP (Sorgt dafür, dass das Bild gezeichnet wird)
        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const dt = Math.min(clock.getDelta(), 0.1);
            // Handy: Das Sheet deckt das Studio ganz ab, also nicht weiter zeichnen
            if (!desktop && modal.classList.contains('active')) return;
            menuCam.update(dt);
            // Licht geht waehrend der Fahrt an, etwas verzoegert gegenueber der Bewegung
            const light = THREE.MathUtils.smoothstep(menuCam.introT, 0.05, 0.7);
            studio.setLight(light);

            // Schein unter dem hervorgehobenen Objekt ein- bzw. ausblenden
            const active = modal.classList.contains('active') ? null : labels.active;
            for (const item of objects.items) {
                if (!item.glow) continue;
                const m = item.glow.material;
                m.opacity += ((item.id === active ? 0.9 : 0) - m.opacity) * (1 - Math.exp(-12 * dt));
                item.glow.visible = m.opacity > 0.01;
            }
            labels.container.style.opacity = light;
            labels.update(camera, window.innerWidth, window.innerHeight);
            renderer.render(scene, camera);
        }

        // Auf Fenstergrößenänderung reagieren: neues Seitenverhältnis, neuer Abstand (F-04)
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            updateFrame();
        });

        animate();
    </script>
</body>
</html>
