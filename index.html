    <style>
        :root { color-scheme: light only; }
        [hidden] { display: none !important; }

        body {
            margin: 0;
            overflow: hidden; /* Verhindert Scrollbalken */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f8f8fa;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }

        /* Name und Titel oben links (F-40) */
        #ui-layer {
            position: absolute;
            top: 20px;
            left: 20px;
            max-width: calc(100% - 40px);
            pointer-events: none; /* Klicks gehen durch diesen Text durch ins 3D */
            color: #333;
        }
        #site-title { color: #555; } /* auf der hellgrauen Wand (#dedee0) mindestens 4,5:1 */
        .wip {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 12px;
            padding: 6px 12px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid #ececf0;
            font-size: 0.75rem;
            color: #333;
        }
        .wip::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #f5c400; flex: none; }
        .wip strong { font-weight: 600; }
        .wip span { color: #666; }
        .wip[hidden] { display: none; }

        /* Dauerhafte Bedienelemente oben rechts (F-41): CV, E-Mail, GitHub, LinkedIn, Sprache */
        #toolbar {
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 5;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .tb {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 44px;
            min-height: 44px;
            padding: 0 16px;
            box-sizing: border-box;
            border: 1px solid #e2e2e6;
            border-radius: 22px;
            background: rgba(255, 255, 255, 0.92);
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.05);
            color: #111;
            font-family: inherit;
            font-size: 0.85rem;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
        }
        .tb:hover { border-color: #111; }
        .tb.primary { background: #111; border-color: #111; color: #fff; }
        .tb.primary:hover { background: #333; }
        .tb.icon { padding: 0; font-size: 0.95rem; }
        .tb.icon svg { display: block; }
        .tb[aria-disabled="true"] { color: #aaa; cursor: default; }
        .tb[aria-disabled="true"]:hover { border-color: #e2e2e6; }
        /* Fokusrahmen zweifarbig: Gelb allein hat auf dem hellen Studio zu wenig Kontrast (1,6:1 statt 3:1),
           der dunkle Ring ist auf hellem, der gelbe auf dunklem Grund gut sichtbar */
        .tb:focus-visible, .lang button:focus-visible, #legal a:focus-visible {
            outline: 3px solid #111;
            outline-offset: 2px;
            box-shadow: 0 0 0 2px #f5c400;
        }
        .lang {
            display: flex;
            padding: 3px;
            border: 1px solid #e2e2e6;
            border-radius: 22px;
            background: rgba(255, 255, 255, 0.92);
        }
        .lang button {
            min-width: 40px;
            height: 36px;
            border: 0;
            border-radius: 18px;
            background: none;
            color: #666;
            font-family: inherit;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
        }
        .lang button[aria-pressed="true"] { background: #111; color: #fff; }
        /* Touch: Sprachknöpfe 44 × 44 px wie die übrigen Knöpfe */
        @media (pointer: coarse) {
            .lang { padding: 0; }
            .lang button { min-width: 44px; height: 44px; border-radius: 22px; }
        }

        /* Kleine Links auf Impressum und Datenschutz (F-43) */
        #legal {
            position: fixed;
            left: 20px;
            bottom: 12px;
            z-index: 5;
            display: flex;
            gap: 4px;
            font-size: 0.75rem;
        }
        #legal a { display: inline-flex; align-items: center; min-height: 32px; padding: 0 6px; color: #666; text-decoration: none; }
        #legal a:hover { color: #111; text-decoration: underline; }

        /* Ohne JavaScript (F-52) */
        .noscript { position: absolute; inset: 0; z-index: 20; padding: 32px 20px; background: #f8f8fa; color: #222; line-height: 1.6; }
        .noscript p { font-family: inherit; }
        .noscript ul { padding-left: 20px; }
        .noscript a { color: #111; }
        .noscript .small { font-size: 0.85rem; }

        /* Schmale Handys: Leiste unten, gut mit dem Daumen erreichbar */
        @media (max-width: 640px) {
            #ui-layer { top: 16px; left: 16px; max-width: calc(100% - 32px); }
            h1 { font-size: 1.2rem !important; }
            .wip span { display: none; }
            #toolbar { top: auto; right: auto; left: 50%; bottom: calc(40px + env(safe-area-inset-bottom)); transform: translateX(-50%); }
            #legal { left: 50%; bottom: calc(4px + env(safe-area-inset-bottom)); transform: translateX(-50%); white-space: nowrap; }
        }

        h1 {
            margin: 0;
            font-size: 1.5rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        p {
            margin: 5px 0 0 0;
            font-family: monospace;
            color: #666;
        }

        /* Fenster (F-36): Desktop als Karte über dem Studio, Handy als Vollbild-Sheet von unten */
        #project-modal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: none; /* Standardmäßig versteckt */
            flex-direction: column;
            width: 80%;
            max-width: 640px;
            max-height: 86vh;
            background: rgba(255, 255, 255, 0.96);
            border-radius: 8px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            z-index: 10;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0,0,0,0.05);
        }
        #project-modal.wide { max-width: 920px; }

        #project-content {
            overflow-y: auto;
            overscroll-behavior: contain;
            padding: 40px;
        }
        #project-content h2 { margin: 0 0 4px; }
        #project-content h3 {
            margin: 24px 0 8px;
            font-size: 0.8rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #666;
        }
        #project-content p {
            color: #333;
            line-height: 1.6;
            font-family: inherit;
            margin-top: 10px;
        }

        #project-modal.active {
            display: flex;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translate(-50%, -45%); }
            to { opacity: 1; transform: translate(-50%, -50%); }
        }

        @media (hover: none), (pointer: coarse) {
            #project-modal, #project-modal.wide {
                position: fixed;
                top: 0;
                left: 0;
                transform: none;
                width: 100%;
                max-width: none;
                height: 100%;
                max-height: none;
                border-radius: 0;
                border: 0;
                background: #fff;
            }
            #project-modal.active { animation: sheetIn 0.3s ease; }
            #project-content { padding: 56px 20px calc(32px + env(safe-area-inset-bottom)); }
        }
        @keyframes sheetIn {
            from { transform: translateY(100%); }
            to { transform: none; }
        }
        @media (prefers-reduced-motion: reduce) {
            #project-modal.active { animation: none; }
        }

        /* Buttons, Skills, Ladeanzeige, Medien im Fenster */
        .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
        .btn {
            display: inline-flex;
            align-items: center;
            min-height: 44px;
            padding: 0 18px;
            border-radius: 22px;
            border: 1px solid #d6d6db;
            color: #111;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
        }
        .btn:hover { border-color: #111; }
        .btn.primary { background: #111; border-color: #111; color: #fff; }
        .btn.primary:hover { background: #333; }
        .btn:focus-visible { outline: 3px solid #111; outline-offset: 2px; box-shadow: 0 0 0 2px #f5c400; }
        .btn .only { margin-left: 10px; padding: 3px 8px; border-radius: 10px; background: #f5c400; color: #111; font-size: 0.7rem; }
        .skills { display: flex; flex-wrap: wrap; gap: 8px; padding: 0; margin: 0; list-style: none; }
        .skills li { padding: 6px 12px; border-radius: 14px; background: #f0f0f2; font-size: 0.85rem; }

        .loading {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: #666;
            font-size: 0.9rem;
            background: #f4f4f6;
        }
        .loading.failed { color: #a33; }
        .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid #d6d6db;
            border-top-color: #f5c400;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .pdf { position: relative; margin-top: 20px; height: max(320px, calc(86vh - 300px)); border-radius: 6px; overflow: hidden; background: #f4f4f6; }
        .pdf iframe { width: 100%; height: 100%; border: 0; }
        .pdf.preview { height: auto; min-height: 200px; max-width: 360px; border: 1px solid #e4e4e8; }
        .pdf.preview img { display: block; width: 100%; height: auto; }

        .impact-demo { margin: 20px 0 0; }
        .impact-demo canvas { display: block; width: min(100%, 340px); aspect-ratio: 1; margin: 0 auto; }
        .impact-demo figcaption { margin-top: 8px; color: #666; font-size: 0.85rem; text-align: center; }

        .model-view { position: relative; margin-top: 20px; height: min(55vh, 460px); border-radius: 6px; overflow: hidden; background: #f4f4f6; touch-action: none; }
        .model-view canvas { display: block; width: 100%; height: 100%; cursor: grab; }
        .model-view .hint { position: absolute; left: 12px; bottom: 8px; margin: 0; font-size: 0.75rem; color: #666; pointer-events: none; }

        .close-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            z-index: 1;
            width: 44px;
            height: 44px;
            border: 0;
            background: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: #666; /* mindestens 3:1 auf Weiß */
            transition: color 0.2s;
        }

        /* Klick daneben schließt das Fenster (F-23) */
        #modal-backdrop {
            position: fixed;
            inset: 0;
            z-index: 9;
            display: none;
            background: rgba(20, 20, 24, 0.08);
        }
        #modal-backdrop.active { display: block; }

        /* Labels über den Objekten (F-20 bis F-22, F-25): Buttons, mindestens 44 × 44 px */
        #labels {
            position: absolute;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
        }
        .obj-label {
            position: absolute;
            left: 0;
            top: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 44px;
            min-height: 44px;
            padding: 0;
            border: 0;
            border-radius: 22px;
            background: none;
            cursor: pointer;
            pointer-events: auto;
            opacity: 0;
            transition: opacity 0.2s;
        }
        .obj-label span {
            padding: 8px 14px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.92);
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
            color: #111;
            font: 600 0.72rem/1 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            white-space: nowrap;
        }
        .obj-label span::before {
            content: "";
            display: inline-block;
            width: 7px;
            height: 7px;
            margin-right: 7px;
            border-radius: 50%;
            background: #c9c9ce;
            vertical-align: 1px;
            transition: background 0.2s;
        }
        .obj-label.active span::before { background: #f5c400; }
        .obj-label.shown { opacity: 1; }
        .obj-label:focus-visible { outline: none; }
        .obj-label:focus-visible span {
            outline: 3px solid #111;
            outline-offset: 2px;
            box-shadow: 0 0 0 2px #f5c400;
        }

        .close-btn:focus-visible {
            outline: 3px solid #111;
            outline-offset: -5px;
            box-shadow: inset 0 0 0 2px #f5c400;
            border-radius: 50%;
        }

        .close-btn:hover {
            color: #000;
        }

        .tag {
            background: #000;
            color: #fff;
            padding: 4px 8px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 0.8rem;
            display: inline-block;
            margin-right: 5px;
            margin-bottom: 15px;
        }
    </style>

    <!-- Import Maps für modernes JavaScript (erlaubt das Laden von Three.js ohne Server/Bundler) -->
    <!-- Fallback (F-51): Ohne WebGL, ohne Import-Maps (z. B. Safari vor 16.4) oder wenn die Szene mit einem Fehler
         abbricht bzw. nach 20 s nicht steht, geht es zur Listenansicht. Das Modul setzt `studioReady`, sobald es läuft. -->
    <script>
        (function () {
            function toList(reason) {
                if (window.studioReady) return;
                window.studioReady = true; // nur einmal umleiten
                location.replace('list.html?fallback=' + reason + location.hash);
            }
            var gl = false;
            try {
                var c = document.createElement('canvas');
                gl = !!(window.WebGLRenderingContext && (c.getContext('webgl2') || c.getContext('webgl')));
            } catch (e) { /* kein WebGL */ }
            var importMaps = window.HTMLScriptElement && HTMLScriptElement.supports && HTMLScriptElement.supports('importmap');
            if (!gl) return toList('webgl');
            if (!importMaps) return toList('browser');
            window.addEventListener('error', function () { toList('error'); });
            window.addEventListener('unhandledrejection', function () { toList('error'); });
            setTimeout(function () { toList('timeout'); }, 20000);
        })();
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
        import { createStudio } from './js/studio.js';
        import { MenuCamera } from './js/menu-camera.js';
        import { loadContent, createObjects } from './js/objects.js';
        import { Labels } from './js/labels.js';
        import { renderWindow } from './js/windows.js';
        import { initialLang, saveLang, applyUI, contactLinks } from './js/i18n.js';

        // Desktop = Maus mit Hover; alles andere bekommt die Handy-Variante (kein Mitschwenken, günstigere Spiegelung)
        const desktop = window.matchMedia('(hover: hover) and (pointer: fine)').matches;
        const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        // 1. RENDERER, SZENE, KAMERA
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // N-02
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 100);

        // 2. STUDIO: Hohlkehle, Spiegelboden, Lichtband, Softboxen, Environment-Map (js/studio.js)
        const studio = createStudio(renderer, scene, { mobile: !desktop });

        // Menü-Kamera: fest, minimal mitschwenkend, Einstiegsfahrt mit Licht-an (js/menu-camera.js)
        const menuCam = new MenuCamera(camera, { sway: desktop && !reducedMotion, intro: !reducedMotion });

        // Alle Modelle sind Draco-komprimierte GLBs aus Blender
        const dracoLoader = new DRACOLoader();
        dracoLoader.setDecoderPath('./vendor/three@0.160.0/examples/jsm/libs/draco/gltf/');
        const gltfLoader = new GLTFLoader();
        gltfLoader.setDRACOLoader(dracoLoader);

        // 3. OBJEKTE: alles aus content/objects.json (js/objects.js)
        const [content, site] = await Promise.all([
            loadContent('./content/objects.json'),
            loadContent('./content/site.json').catch(() => ({})), // ohne site.json bleiben die Texte aus dem HTML
        ]);
        let lang = initialLang(); // F-60, F-62
        let hitTargets = []; // vor createObjects, weil das schon beim Bauen updateFrame aufruft
        const objects = createObjects(scene, renderer, content.objects, gltfLoader, updateFrame);
        hitTargets = objects.hitTargets;
        const labels = new Labels(document.getElementById('labels'), objects.items, lang, {
            alwaysVisible: !desktop, // F-21
            onOpen: (id) => openProject(id),
            avoid: ['site-name', 'site-title', 'wip', 'toolbar', 'legal'].map((id) => document.getElementById(id)),
        });

        // SPRACHE UND BEDIENELEMENTE (F-40 bis F-43, F-60, F-61)
        function setLang(next) {
            lang = next;
            document.documentElement.lang = lang;
            applyUI(document, lang);
            if (site.name) document.getElementById('site-name').textContent = site.name;
            if (site.title?.[lang]) document.getElementById('site-title').textContent = site.title[lang];
            for (const b of document.querySelectorAll('.lang button')) b.setAttribute('aria-pressed', String(b.dataset.lang === lang));
            labels.setLang(lang);
        }
        for (const b of document.querySelectorAll('.lang button')) {
            b.addEventListener('click', () => { saveLang(b.dataset.lang); setLang(b.dataset.lang); });
        }
        document.getElementById('wip').hidden = site.wip === false;

        // Kontakt-Links: leere Felder in site.json bleiben sichtbar, sind aber als „folgt“ deaktiviert
        const contact = contactLinks(site.contact);
        for (const a of document.querySelectorAll('[data-contact]')) {
            const url = contact[a.dataset.contact];
            if (url) a.href = url;
            else a.setAttribute('aria-disabled', 'true');
            a.addEventListener('click', (event) => { if (!url) event.preventDefault(); });
        }

        // CV öffnet das PDF-Fenster (F-41, F-30): das erste sichtbare Objekt vom Typ `pdf`
        const cvObject = content.objects.find((o) => o.window === 'pdf' && o.visible !== false);
        const cvBtn = document.getElementById('cv-btn');
        if (cvObject) cvBtn.addEventListener('click', () => openProject(cvObject.id));
        else cvBtn.hidden = true;
        setLang(lang);

        // Rahmen = Ecken der Klickflächen aller Objekte (die Box im Raum des Objekts, gedreht mit ihm; eine
        // achsparallele Weltbox wäre bei schräg stehenden Objekten größer). Die Softboxen kommen knapp außerhalb hin.
        const unitCorners = [-0.5, 0.5].flatMap((x) => [-0.5, 0.5].flatMap((y) => [-0.5, 0.5].map((z) => new THREE.Vector3(x, y, z))));
        function updateFrame() {
            menuCam.frame(hitTargets.flatMap((hit) => unitCorners.map((c) => c.clone().applyMatrix4(hit.matrixWorld))));
            studio.placeSoftboxes(camera, menuCam.restPosition(), menuCam.goal.target);
        }
        updateFrame();

        // 4. EINSTIEG: Antippen, Klicken oder eine Taste ueberspringt die Kamerafahrt (F-05)
        let suppressClick = false;
        const skipIntro = (event) => {
            // der Klick, der die Fahrt abbricht, oeffnet noch kein Fenster
            suppressClick = menuCam.inIntro && event.type === 'pointerdown' && event.target === renderer.domElement;
            menuCam.skipIntro();
        };
        window.addEventListener('pointerdown', skipIntro);
        window.addEventListener('keydown', skipIntro);

        // 5. RAYCASTING: Hover am Desktop (F-20), Klick bzw. Antippen öffnet direkt (F-21)
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        const modal = document.getElementById('project-modal');
        const backdrop = document.getElementById('modal-backdrop');

        function pick(event) {
            // Umrechnung der Mauskoordinaten für Three.js (-1 bis +1)
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            return raycaster.intersectObjects(hitTargets)[0]?.object.userData.id ?? null;
        }

        renderer.domElement.addEventListener('pointermove', (event) => {
            if (event.pointerType !== 'mouse') return;
            labels.sceneHover = pick(event);
            renderer.domElement.style.cursor = labels.sceneHover ? 'pointer' : '';
        });
        renderer.domElement.addEventListener('pointerleave', () => {
            labels.sceneHover = null;
            renderer.domElement.style.cursor = '';
        });
        renderer.domElement.addEventListener('click', (event) => {
            if (suppressClick) { suppressClick = false; return; }
            const id = pick(event);
            if (id) openProject(id);
        });

        // 6. FENSTER: öffnen, schließen, eigene URL pro Fenster (F-23, F-24)
        // Öffnen legt einen History-Eintrag `#id` an, damit Zurück (Geste oder Button) das Fenster schließt.
        const byId = (id) => content.objects.find((o) => o.id === id && o.visible !== false);
        let returnFocus = null;
        // Solange das Fenster offen ist, ist alles dahinter für Tastatur und Screenreader gesperrt (N-07)
        const behindWindow = ['canvas-container', 'ui-layer', 'legal', 'toolbar', 'labels'].map((id) => document.getElementById(id));
        const setBehindInert = (on) => behindWindow.forEach((el) => { el.inert = on; });

        function openProject(id) {
            if (!byId(id)) return;
            if (location.hash !== '#' + id) history.pushState({ object: id }, '', '#' + id);
            showProject(id);
        }

        function closeProject() {
            if (!modal.classList.contains('active')) return;
            // selbst angelegter Eintrag: zurückgehen; Deep-Link von außen: nur den Hash entfernen
            if (history.state?.object) history.back();
            else {
                history.replaceState(null, '', location.pathname + location.search);
                hideProject();
            }
        }

        let cleanupWindow = null;
        let shownId = null;
        function showProject(id) {
            if (id === shownId) return; // hashchange und popstate kommen oft beide
            shownId = id;
            const def = byId(id);
            cleanupWindow?.();
            // Fensterinhalt je nach Typ (js/windows.js); Schweres lädt erst jetzt (F-35)
            cleanupWindow = renderWindow(def, document.getElementById('project-content'), { lang, mobile: !desktop, reducedMotion, gltfLoader });
            modal.classList.toggle('wide', def.window === 'pdf' || def.window === 'model+text');
            if (!modal.classList.contains('active')) returnFocus = document.activeElement;
            menuCam.skipIntro();
            modal.classList.add('active');
            backdrop.classList.add('active');
            setBehindInert(true);
            labels.sceneHover = null;
            document.getElementById('close-modal').focus();
        }

        function hideProject() {
            cleanupWindow?.();
            cleanupWindow = null;
            shownId = null;
            document.getElementById('project-content').replaceChildren();
            modal.classList.remove('active');
            backdrop.classList.remove('active');
            setBehindInert(false);
            if (returnFocus?.isConnected) returnFocus.focus();
            returnFocus = null;
        }

        // Hash bestimmt, welches Fenster offen ist: Zurück, Vor, Deep-Link, Hash von Hand geändert
        function syncFromHash() {
            let id = '';
            try { id = decodeURIComponent(location.hash.slice(1)); } catch { /* kaputter Hash: kein Fenster */ }
            if (byId(id)) showProject(id);
            else if (modal.classList.contains('active')) hideProject();
        }
        window.addEventListener('popstate', syncFromHash);
        window.addEventListener('hashchange', syncFromHash);
        syncFromHash();

        document.getElementById('close-modal').addEventListener('click', closeProject);
        backdrop.addEventListener('click', closeProject);
        window.addEventListener('keydown', (event) => {
            if (!modal.classList.contains('active')) return;
            if (event.key === 'Escape') closeProject();
            // Fokusfalle (N-07): Tab bleibt im Fenster
            if (event.key === 'Tab') {
                const focusable = [...modal.querySelectorAll('button, a[href]')];
                const first = focusable[0], last = focusable[focusable.length - 1];
                if (event.shiftKey && document.activeElement === first) { last.focus(); event.preventDefault(); }
                else if (!event.shiftKey && document.activeElement === last) { first.focus(); event.preventDefault(); }
            }
        });

        // 7. ANIMATION LOOP (Sorgt dafür, dass das Bild gezeichnet wird)
        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const dt = Math.min(clock.getDelta(), 0.1);
            // Handy: Das Sheet deckt das Studio ganz ab, also nicht weiter zeichnen
            if (!desktop && modal.classList.contains('active')) return;
            menuCam.update(dt);
            // Licht geht waehrend der Fahrt an, etwas verzoegert gegenueber der Bewegung
            const light = THREE.MathUtils.smoothstep(menuCam.introT, 0.05, 0.7);
            studio.setLight(light);

            // Schein unter dem hervorgehobenen Objekt ein- bzw. ausblenden
            const active = modal.classList.contains('active') ? null : labels.active;
            for (const item of objects.items) {
                if (!item.glow) continue;
                const m = item.glow.material;
                m.opacity += ((item.id === active ? 0.9 : 0) - m.opacity) * (1 - Math.exp(-12 * dt));
                item.glow.visible = m.opacity > 0.01;
            }
            labels.container.style.opacity = light;
            labels.update(camera, window.innerWidth, window.innerHeight);
            renderer.render(scene, camera);
        }

        // Auf Fenstergrößenänderung reagieren: neues Seitenverhältnis, neuer Abstand (F-04)
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            updateFrame();
        });

        animate();
        window.studioReady = true; // Szene läuft, kein Fallback mehr (F-51)
    </script>
</body>
</html>
